<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Recording Overlay</title>
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				background: transparent;
				overflow: hidden;
				user-select: none;
				-webkit-user-select: none;
				display: flex;
				align-items: center;
				justify-content: center;
				pointer-events: none;
			}

			.overlay {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				padding: 12px 16px;
				min-width: 180px;
				border-radius: 12px;
				border: 1px solid rgba(255, 255, 255, 0.25);
				background: rgba(0, 0, 0, 0.8);
				color: #fff;
				backdrop-filter: blur(10px);
				-webkit-backdrop-filter: blur(10px);
				box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
				cursor: pointer;
				transition: background-color 0.2s ease;
				pointer-events: auto;
			}

			.overlay:hover {
				background: rgba(0, 0, 0, 0.9);
			}

			.dot {
				width: 12px;
				height: 12px;
				border-radius: 50%;
				background: #f97316;
				animation: spin 1s linear infinite;
				flex-shrink: 0;
			}

			.overlay.recording .dot {
				background: #ef4444;
				animation: pulse 1.2s ease-in-out infinite;
			}

			.text {
				font-size: 13px;
				font-weight: 600;
				line-height: 1;
				white-space: nowrap;
			}

			@keyframes pulse {
				0%,
				100% {
					transform: scale(1);
					opacity: 1;
				}
				50% {
					transform: scale(1.2);
					opacity: 0.65;
				}
			}

			@keyframes spin {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}
		#voice-transcript { color: white; max-height: 48px; overflow: auto; margin-top: 8px; line-height: 1.4; font-size: 14px; }
#voice-assistant { max-height: 35px; overflow: auto; color: #93c5fd; line-height: 1.4; font-size: 13px; margin-top: 6px; }
.overlay { width: 400px; max-height: 154px; box-sizing: border-box; }
#voice-actions { margin-top: 6px; } #voice-actions button { margin-right: 8px; border: 1px solid #64748b; border-radius: 6px; padding: 3px 8px; background: #1e293b; color: white; cursor: pointer; }
#voice-connection, #voice-retry, #voice-budget { flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; font-size: 12px; line-height: 1.4; text-align: center; }
#voice-connection:empty, #voice-retry:empty, #voice-budget:empty { display: none; }
#voice-retry, #voice-budget { color: #fcd34d; }
</style>
	</head>
	<body>
		<div id="overlay" class="overlay recording">
			<div class="dot"></div>
			<div><div id="text" class="text">Recording... Click to stop</div><div id="voice-transcript" aria-live="polite"></div><div id="voice-connection" role="status"></div><div id="voice-retry" role="status"></div><div id="voice-budget" role="status"></div><div id="voice-assistant" aria-live="polite"></div><div id="voice-actions" hidden><button id="voice-copy">Copy result</button><button id="voice-dismiss">Dismiss</button></div></div>
		</div>

		<script>
			const invoke =
				window.__TAURI_INTERNALS__?.invoke ??
				window.__TAURI__?.core?.invoke ??
				window.__TAURI__?.invoke;
			const listen =
				window.__TAURI__?.event?.listen ?? window.__TAURI__?.listen;

			window.__WM_RENDER_VOICE = () => { const data = window.__WM_VOICE || {}; if (data.phase) document.getElementById('text').textContent = ({connecting:'Connecting…', recording:'Listening · click to finish', processing:'Finishing…', idle:'Voice session ended'})[data.phase]; document.getElementById('voice-transcript').textContent = data.result ?? data.transcript ?? ''; document.getElementById('voice-connection').textContent = data.connectionStatus || ''; document.getElementById('voice-retry').textContent = data.retryText || ''; document.getElementById('voice-budget').textContent = data.budgetWarning || '';
  for (const id of ['voice-connection', 'voice-retry', 'voice-budget']) document.getElementById(id).title = document.getElementById(id).textContent;
  document.getElementById('voice-assistant').textContent = data.assistant || ''; document.getElementById('voice-actions').hidden = data.phase !== 'idle'; document.getElementById('voice-copy').textContent = typeof data.result === 'string' ? 'Copy result' : 'Copy transcript'; const transcript = document.getElementById('voice-transcript'); transcript.scrollTop = transcript.scrollHeight; };
			const overlay = document.getElementById('overlay');
			const text = document.getElementById('text');
			let currentState = 'Recording';

			const normalizeState = (state) => {
				if (typeof state !== 'string') return 'Hidden';
				const normalized = state.toLowerCase();
				if (normalized === 'recording') return 'Recording';
				if (normalized === 'processing') return 'Processing';
				return 'Hidden';
			};

			const updateOverlayState = (state) => {
				currentState = normalizeState(state);

				if (currentState === 'Hidden') {
					overlay.style.display = 'none';
					return;
				}

				overlay.style.display = 'inline-flex';
				overlay.classList.toggle('recording', currentState === 'Recording');
				text.textContent =
					currentState === 'Recording'
						? 'Recording... Click to stop'
						: 'Processing...';
			};
			window.__WM_OVERLAY_SET_STATE = updateOverlayState;

			if (listen) {
				listen('overlay-state-changed', (event) => {
					updateOverlayState(event.payload);
				});
			}

			const syncOverlayStateFromBackend = async () => {
				if (!invoke) return;
				try {
					const state = await invoke('get_overlay_state');
					updateOverlayState(state);
				} catch (error) {
					console.error('Failed to get initial overlay state:', error);
				}
			};

			document.getElementById('voice-copy').addEventListener('click', async (event) => { event.stopPropagation(); const data = window.__WM_VOICE || {}; if (invoke) await invoke('plugin:clipboard-manager|write_text', { text: data.result ?? data.transcript ?? '' }); });
            document.getElementById('voice-dismiss').addEventListener('click', async (event) => { event.stopPropagation(); if (invoke) await invoke('hide_recording_overlay'); });
            overlay.addEventListener('click', async () => {
                if (window.__WM_VOICE?.phase === 'idle') return;
				if (currentState !== 'Recording' || !invoke) return;
				try {
					await invoke('stop_recording_from_overlay');
				} catch (error) {
					console.error('Failed to stop recording from overlay:', error);
				}
			});

			document.addEventListener('contextmenu', (event) =>
				event.preventDefault(),
			);
			document.addEventListener('selectstart', (event) =>
				event.preventDefault(),
			);

			updateOverlayState('Hidden');
			syncOverlayStateFromBackend();
		</script>
	</body>
</html>
